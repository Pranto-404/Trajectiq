name: CI
on:
  push:
    branches: [main, 'v6-*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the standalone game
        run: npm run build
      - name: The committed standalone file is up to date
        run: git diff --exit-code -- dist/TRAJECTIQ_Play.html
      - name: Run the test suite
        run: npm test
